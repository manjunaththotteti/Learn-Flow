<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LearnFlow - Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <section class="card profile-card">
      <h2>Student Profile</h2>
      <div class="avatar large"><i class="fas fa-user"></i></div>
      <h3 id="profile-name"></h3>
      <p>Topics Completed: 12</p>
      <p>Focus Score: 87%</p>
      <button class="start-learning-btn" onclick="window.location.href='dashboard.html'">Go to Dashboard</button>
    </section>
  </main>

  <script>
    const user = localStorage.getItem("learnflowUser");
    document.getElementById("profile-name").textContent = user || "Student";
  </script>
</body>
</html>
